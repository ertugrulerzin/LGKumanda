name: lg_kumanda
description: LG webOS televizyonlar için Mac, Windows ve Android kumandası.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  crypto: ^3.0.8
  xml: ^7.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/web_focus.js
