name: lg_kumanda
description: LG webOS televizyonlar için Mac, Windows ve Android kumandası.
publish_to: none
version: 1.0.0+22
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  crypto: ^3.0.8
  xml: ^7.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  # Upstream prerelease includes the AGP 9 compatibility fix.
  flutter_inappwebview: 6.2.0-beta.3
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/web_focus.js
    - assets/web_video.js
