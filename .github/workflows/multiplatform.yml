name: Mac Windows Android
on:
  push:
    branches: [main]
    paths: ['cross_platform/**', '!cross_platform/**/*.md', '.github/workflows/multiplatform.yml']
  pull_request:
    paths: ['cross_platform/**', '!cross_platform/**/*.md', '.github/workflows/multiplatform.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Build all platforms or only Windows
        type: choice
        default: all
        options: [all, windows]
permissions:
  contents: read
concurrency:
  group: multiplatform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'windows' && '[{"os":"windows-latest","target":"windows"}]' || '[{"os":"macos-latest","target":"macos"},{"os":"windows-latest","target":"windows"},{"os":"ubuntu-latest","target":"android"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: cross_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        if: matrix.target == 'windows'
        with:
          path: cross_platform/build/windows/x64
          key: windows-native-flutter350-${{ hashFiles('cross_platform/pubspec.lock', 'cross_platform/windows/**') }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release
        if: matrix.target == 'macos'
      - run: |
          mkdir -p build/dmg-root
          ditto 'build/macos/Build/Products/Release/LG Kumanda.app' 'build/dmg-root/LG Kumanda.app'
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname 'LG Kumanda' -srcfolder build/dmg-root -ov -format UDZO build/LGKumanda-macOS.dmg
        if: matrix.target == 'macos'
      - name: Build Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            cmake --install build/windows/x64 --config Release --verbose
            exit 1
          }
      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'LGKumanda-smoke'
          $setup = Start-Process 'build/LGKumanda-Windows-Setup.exe' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code: $($setup.ExitCode)" }
          foreach ($file in @('lg_kumanda.exe', 'flutter_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'data/flutter_assets')) {
            if (!(Test-Path (Join-Path $installDir $file))) { throw "Missing installed file: $file" }
          }
          $application = Start-Process (Join-Path $installDir 'lg_kumanda.exe') -WorkingDirectory $installDir -PassThru
          try {
            if ($application.WaitForExit(5000)) { throw "Application exited during startup: $($application.ExitCode)" }
          } finally {
            if (!$application.HasExited) { Stop-Process -Id $application.Id -Force }
          }
          $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code: $($uninstall.ExitCode)" }
      - run: flutter build apk --release
        if: matrix.target == 'android'
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/LGKumanda-Android-preview.apk
        if: matrix.target == 'android'
      - uses: actions/upload-artifact@v4
        with:
          name: LGKumanda-${{ matrix.target }}-preview
          if-no-files-found: error
          path: |
            cross_platform/build/LGKumanda-macOS.dmg
            cross_platform/build/LGKumanda-Windows-Setup.exe
            cross_platform/build/LGKumanda-Android-preview.apk
