name: Mac Windows Android
on:
  push:
    branches: [main]
    paths: ['cross_platform/**', '!cross_platform/**/*.md', '.github/workflows/multiplatform.yml']
  pull_request:
    paths: ['cross_platform/**', '!cross_platform/**/*.md', '.github/workflows/multiplatform.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiplatform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: cross_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release
        if: matrix.target == 'macos'
      - run: |
          mkdir -p build/dmg-root
          ditto 'build/macos/Build/Products/Release/LG Kumanda.app' 'build/dmg-root/LG Kumanda.app'
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname 'LG Kumanda' -srcfolder build/dmg-root -ov -format UDZO build/LGKumanda-macOS.dmg
        if: matrix.target == 'macos'
      - run: flutter build windows --release
        if: matrix.target == 'windows'
      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter build apk --debug
        if: matrix.target == 'android'
      - run: cp build/app/outputs/flutter-apk/app-debug.apk build/LGKumanda-Android-preview.apk
        if: matrix.target == 'android'
      - uses: actions/upload-artifact@v4
        with:
          name: LGKumanda-${{ matrix.target }}-preview
          if-no-files-found: error
          path: |
            cross_platform/build/LGKumanda-macOS.dmg
            cross_platform/build/LGKumanda-Windows-Setup.exe
            cross_platform/build/LGKumanda-Android-preview.apk
