name: Mac Windows Android
on:
  push:
    branches: [main]
    paths: ['cross_platform/**', '.github/workflows/multiplatform.yml']
  pull_request:
    paths: ['cross_platform/**', '.github/workflows/multiplatform.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: cross_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --release
        if: matrix.target == 'macos'
      - run: ditto -c -k --sequesterRsrc --keepParent 'build/macos/Build/Products/Release/LG Kumanda.app' build/LGKumanda-macOS.zip
        if: matrix.target == 'macos'
      - run: flutter build windows --release
        if: matrix.target == 'windows'
      - run: flutter build apk --debug
        if: matrix.target == 'android'
      - uses: actions/upload-artifact@v4
        with:
          name: LGKumanda-${{ matrix.target }}-preview
          if-no-files-found: error
          path: |
            cross_platform/build/LGKumanda-macOS.zip
            cross_platform/build/windows/x64/runner/Release/
            cross_platform/build/app/outputs/flutter-apk/app-debug.apk
