name: LGKumanda
options:
  bundleIdPrefix: com.ertugrul
  deploymentTarget:
    iOS: '17.0'
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: PBY9P5GVFB
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '23'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  LGKumanda:
    type: application
    platform: iOS
    sources: [LGKumanda]
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: LGKumanda/Info.plist
      properties:
        CFBundleDisplayName: Kumanda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: LG televizyonunu ve HDMI kutusunu bulmak ve kumanda etmek için yerel ağ erişimi gerekir.
        NSBonjourServices: [_androidtvremote2._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # AdMob: Google's sample app ID until the real one is set. Without
        # KumandaBannerAdUnitID, release builds show no ads.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        KumandaBannerAdUnitID: ''
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ertugrul.LGKumanda
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LGKumandaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LGKumandaTests]
    dependencies:
      - target: LGKumanda
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  LGKumandaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LGKumandaUITests]
    dependencies:
      - target: LGKumanda
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  LGKumanda:
    build:
      targets:
        LGKumanda: all
        LGKumandaTests: [test]
    test:
      targets: [LGKumandaTests, LGKumandaUITests]
